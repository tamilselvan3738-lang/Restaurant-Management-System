{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header bg-white py-3 border-bottom d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2">
                <h5 class="card-title mb-0 fw-bold">{{ title }}</h5>
                <a href="{% url 'menu:inventory' %}" class="btn btn-sm btn-outline-secondary w-100 w-sm-auto text-center">
                    <i class="bi bi-arrow-left me-1"></i> Back to Inventory
                </a>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Ingredient Name</label>
                        {{ form.name }}
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Unit of Measurement</label>
                            {{ form.unit }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Current Stock</label>
                            {{ form.current_stock }}
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Low Stock Threshold</label>
                            {{ form.low_stock_threshold }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Cost per Unit ({{ RESTAURANT_CURRENCY }})</label>
                            {{ form.cost_per_unit }}
                        </div>
                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-between gap-2 pt-3 border-top">
                        <a href="{% url 'menu:inventory' %}" class="btn btn-outline-secondary w-100 w-sm-auto text-center">
                            <i class="bi bi-arrow-left me-1"></i> Back to Inventory
                        </a>
                        <button type="submit" class="btn btn-primary px-4 w-100 w-sm-auto text-center">
                            Save Ingredient
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
