{% extends 'base.html' %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-danger mb-3">500</div>
    <h3 class="fw-bold mb-2">Kitchen Overheat! (Internal Server Error)</h3>
    <p class="text-muted mb-4">An unexpected error occurred while processing your request. Please try again shortly.</p>
    <div class="d-flex justify-content-center gap-2">
        <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 rounded-pill">
            <i class="bi bi-arrow-left me-1"></i> Go Back
        </a>
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4 rounded-pill">
            <i class="bi bi-house-door me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
