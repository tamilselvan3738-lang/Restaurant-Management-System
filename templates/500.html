<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500 Internal Server Error - Growwpark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 1rem;
        }
        .error-card {
            background-color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            max-width: 540px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.6);
        }
        .error-icon {
            font-size: 3.5rem;
            color: #f43f5e;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .badge-ref {
            background-color: rgba(244, 63, 94, 0.15);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: 50rem;
            padding: 0.35rem 0.85rem;
            font-family: ui-monospace, monospace;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 1.25rem;
        }
        .btn-brand {
            background: linear-gradient(135deg, #ea580c, #c2410c);
            color: #ffffff;
            border: none;
            font-weight: 600;
        }
        .btn-brand:hover {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="badge-ref">
            <i class="bi bi-shield-exclamation me-1"></i> HTTP 500 &bull; SERVER ERROR
        </div>
        <div class="error-icon">
            <i class="bi bi-exclamation-octagon-fill"></i>
        </div>
        <h2 class="fw-bold mb-2">Unexpected Server Error</h2>
        <p class="text-secondary small mb-3">
            An internal error occurred while processing your request. Our technical team has been automatically alerted to resolve it.
        </p>

        {% if reference_id %}
        <div class="p-2.5 mb-4 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-25 small font-monospace text-muted">
            Incident Reference: <strong class="text-warning">REF-{{ reference_id }}</strong>
        </div>
        {% endif %}

        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <button onclick="window.location.reload()" class="btn btn-brand px-4 py-2 rounded-pill d-inline-flex align-items-center gap-1.5 shadow-sm">
                <i class="bi bi-arrow-clockwise"></i> Try Again
            </button>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2 rounded-pill d-inline-flex align-items-center gap-1.5 text-light">
                <i class="bi bi-arrow-left"></i> Go Back
            </a>
            <a href="/" class="btn btn-outline-light px-4 py-2 rounded-pill d-inline-flex align-items-center gap-1.5">
                <i class="bi bi-house-door"></i> Home
            </a>
        </div>
    </div>
</body>
</html>
