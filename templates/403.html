{% extends 'base.html' %}

{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-warning mb-3">403</div>
    <h3 class="fw-bold mb-2">Restricted Access</h3>
    <p class="text-muted mb-4">You do not have the required permissions or role to access this section.</p>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
        <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 rounded-pill w-100 w-sm-auto">
            <i class="bi bi-arrow-left me-1"></i> Go Back
        </a>
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4 rounded-pill w-100 w-sm-auto">
            <i class="bi bi-house-door me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
