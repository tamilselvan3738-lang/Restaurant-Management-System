<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Vibrant Culinary Ember -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Metallic Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Vibrant Flame Gradient (Outer) -->
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Glowing Core Flame Gradient -->
    <linearGradient id="flameCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Cloche Silver / Porcelain Gradient -->
    <linearGradient id="clocheGrad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7c2d12" flood-opacity="0.48"/>
    </filter>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fef08a" flood-opacity="0.7"/>
    </filter>

    <!-- Cloche Clip Path: strictly constrains reflections inside the dome -->
    <clipPath id="clocheClip">
      <path d="M 132 324 C 132 196 380 196 380 324 Z"/>
    </clipPath>
  </defs>

  <!-- 1. Master Squircle Canvas (High-contrast boundary for all light & dark browser tabs) -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bgGradient)" filter="url(#badgeShadow)"/>
  
  <!-- Outer Contrast Edge Ring -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="none" stroke="#7c2d12" stroke-width="3" stroke-opacity="0.45"/>

  <!-- Inner Gold Luxury Border -->
  <rect x="38" y="38" width="436" height="436" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-opacity="0.45"/>

  <!-- 2. Ambient Warm Radial Glow -->
  <circle cx="256" cy="240" r="150" fill="#facc15" fill-opacity="0.14"/>

  <!-- 3. Cloche Soft Platter Shadow -->
  <ellipse cx="256" cy="336" rx="132" ry="12" fill="#000000" fill-opacity="0.18"/>

  <!-- 4. Grand Cloche Dome with Clip Path -->
  <g>
    <!-- Base Dome Solid -->
    <path d="M 132 324 C 132 196 380 196 380 324 Z" fill="url(#clocheGrad)"/>
    
    <!-- Sheen & Highlights clipped inside dome -->
    <g clip-path="url(#clocheClip)">
      <!-- Left Crest Specular Highlight -->
      <path d="M 160 324 C 160 236 230 208 266 206" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.85"/>
      <path d="M 184 324 C 184 266 220 248 244 246" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-opacity="0.55"/>
      <!-- Soft Bottom Reflection -->
      <ellipse cx="256" cy="324" rx="120" ry="18" fill="#ffffff" fill-opacity="0.35"/>
    </g>
  </g>

  <!-- 5. Cloche Golden Platter / Rim -->
  <rect x="108" y="324" width="296" height="26" rx="13" fill="url(#goldGrad)"/>
  <line x1="124" y1="329" x2="388" y2="329" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Platter Stand / Curved Rim Foot -->
  <path d="M 156 356 C 198 374 314 374 356 356" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 182 366 C 214 377 298 377 330 366" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- 6. Left Flanking Cutlery: Modern Golden Fork -->
  <g transform="translate(64, 168) scale(0.76)" opacity="0.92">
    <!-- Fork Handle -->
    <path d="M 32 118 L 32 232 C 32 240 25 246 17 246 C 9 246 2 240 2 232 L 2 118 Z" fill="url(#goldGrad)"/>
    <!-- Fork Base & Neck -->
    <path d="M 2 118 C 2 72 32 72 32 118 Z" fill="url(#goldGrad)"/>
    <!-- Fork Prongs (4 crisp prongs) -->
    <rect x="2" y="16" width="5.5" height="66" rx="2.5" fill="url(#goldGrad)"/>
    <rect x="11" y="16" width="5.5" height="66" rx="2.5" fill="url(#goldGrad)"/>
    <rect x="20" y="16" width="5.5" height="66" rx="2.5" fill="url(#goldGrad)"/>
    <rect x="29" y="16" width="5.5" height="66" rx="2.5" fill="url(#goldGrad)"/>
  </g>

  <!-- 7. Right Flanking Cutlery: Modern Golden Chef Knife -->
  <g transform="translate(416, 168) scale(0.76)" opacity="0.92">
    <!-- Knife Blade -->
    <path d="M 2 16 L 24 16 C 24 82 20 140 2 162 Z" fill="url(#goldGrad)"/>
    <line x1="7" y1="20" x2="7" y2="154" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8" stroke-linecap="round"/>
    <!-- Knife Bolster -->
    <rect x="0" y="162" width="24" height="9" rx="2" fill="url(#goldGrad)"/>
    <!-- Knife Handle -->
    <path d="M 2 171 L 2 244 C 2 250 8 254 14 254 C 20 254 24 250 24 244 L 24 171 Z" fill="url(#goldGrad)"/>
    <circle cx="13" cy="188" r="2.8" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="13" cy="213" r="2.8" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="13" cy="238" r="2.8" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- 8. Cloche Flame Handle Base Collar (Hugs top of cloche dome seamlessly) -->
  <rect x="232" y="188" width="48" height="15" rx="7.5" fill="url(#goldGrad)"/>
  <circle cx="256" cy="189" r="10" fill="url(#goldGrad)"/>

  <!-- 9. Iconic Culinary Flame (Passion, Heat, Fresh Cooking) -->
  <g filter="url(#flameGlow)">
    <!-- Outer Dynamic Flame -->
    <path d="M 256 64 
             C 268 92 302 118 306 146 
             C 312 176 290 196 256 196 
             C 222 196 200 176 206 146 
             C 210 122 242 98 246 80 
             C 248 70 253 64 256 64 Z" 
          fill="url(#flameOuter)"/>

    <!-- Inner Core Flame (Glow) -->
    <path d="M 256 108 
             C 264 126 280 142 278 162 
             C 276 176 267 185 256 185 
             C 245 185 236 176 234 162 
             C 232 142 248 126 256 108 Z" 
          fill="url(#flameCore)"/>
  </g>

  <!-- 10. Michelin-Grade Three Culinary Stars at Platter Foot -->
  <!-- Center Grand Star -->
  <polygon points="256,396 261.5,409 275,409 264,417 268,430 256,422 244,430 248,417 237,409 250.5,409" fill="url(#goldGrad)"/>
  <!-- Left Star -->
  <polygon points="212,402 216,412 227,412 218,418 221.5,428 212,421.5 202.5,428 206,418 197,412 208,412" fill="url(#goldGrad)" fill-opacity="0.88"/>
  <!-- Right Star -->
  <polygon points="300,402 304,412 315,412 306,418 309.5,428 300,421.5 290.5,428 294,418 285,412 296,412" fill="url(#goldGrad)" fill-opacity="0.88"/>
</svg>